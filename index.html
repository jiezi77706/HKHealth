<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HK Health Chat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">&#x1F3E5;</div>
    <div class="info">
      <h2>HK Health Assistant</h2>
      <p id="modelDisp">hkgai-v3</p>
    </div>
    <div class="header-actions">
      <button onclick="togglePanel('records')" title="Health Records">&#x1F4CB;</button>
      <button onclick="togglePanel('settings')" title="Settings">&#x2699;</button>
    </div>
  </div>

  <!-- Settings -->
  <div class="panel" id="settingsPanel">
    <div class="panel-header">
      <h3>Settings</h3>
      <button class="close-btn" onclick="togglePanel('settings')">&times;</button>
    </div>
    <div class="panel-body">
      <label>System Prompt (additional)</label>
      <textarea class="sys-prompt" id="sysPromptExtra" placeholder="Additional instructions..."></textarea>
      <label>Temperature (0-2)</label>
      <input type="text" id="tempInput" value="0.7">
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--input-border)">
        <label style="font-size:13px;font-weight:600;margin-bottom:6px">Voice</label>
        <div class="toggle-row">
          <span>Auto-read replies</span>
          <button class="toggle" id="autoTtsToggle" onclick="toggleAutoTts()"></button>
        </div>
        <label>TTS Voice</label>
        <select id="voiceSelect"></select>
        <label>Speech Recognition Language</label>
        <select id="speechLang">
          <option value="zh-HK">Cantonese (zh-HK)</option>
          <option value="zh-TW">Traditional Chinese (zh-TW)</option>
          <option value="zh-CN">Mandarin (zh-CN)</option>
          <option value="en-US">English (en-US)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Health Records -->
  <div class="panel" id="recordsPanel">
    <div class="panel-header">
      <h3>Health Records</h3>
      <button class="close-btn" onclick="togglePanel('records')">&times;</button>
    </div>
    <div class="panel-body" id="recordsList"></div>
    <div class="panel-footer">
      <button onclick="startVisitPrep()">&#x1F4CB; Generate Visit Brief</button>
    </div>
  </div>

  <!-- Chat -->
  <div class="messages" id="messages">
    <div class="welcome">
      <div class="welcome-greeting">哈囉，想傾下今日身體點呀？</div>
      <div class="welcome-prompts">
        <button class="prompt-chip" data-msg="今日邊度唔舒服呀？">
          <span class="prompt-label">咩事呀</span>
          <span class="prompt-text">今日邊度唔舒服呀？</span>
        </button>
        <button class="prompt-chip" data-msg="係突然出現定慢慢嚟㗎？">
          <span class="prompt-label">幾時開始</span>
          <span class="prompt-text">係突然嚟定慢慢出現？</span>
        </button>
        <button class="prompt-chip" data-msg="可唔可以形容下係咩感覺？">
          <span class="prompt-label">咩感覺</span>
          <span class="prompt-text">可唔可以形容下？</span>
        </button>
        <button class="prompt-chip" data-msg="有冇影響到瞓覺、返工或者食嘢？">
          <span class="prompt-label">影響咗咩</span>
          <span class="prompt-text">瞓覺、返工、食嘢有冇影響？</span>
        </button>
        <button class="prompt-chip" data-msg="最近有冇捱夜、飲食變化、壓力大或者其他變化？">
          <span class="prompt-label">可能關咩事</span>
          <span class="prompt-text">捱夜、飲食變化、壓力大？</span>
        </button>
        <button class="prompt-chip" data-msg="自己做咗啲咩？有冇好轉？">
          <span class="prompt-label">之後點</span>
          <span class="prompt-text">做咗啲咩？有冇好轉？</span>
        </button>
      </div>
      <div class="welcome-actions">
        <button class="action-chip" data-msg="我想查下藥品信息">&#x1F48A; 查藥品藥房</button>
        <button class="action-chip" onclick="togglePanel('records')">&#x1F4CB; 身體記錄</button>
        <button class="action-chip" data-msg="我想準備覆診資料">&#x1F5C2; 問診摘要</button>
      </div>
    </div>
  </div>
  <div class="typing-indicator" id="typing"><span></span><span></span><span></span></div>

  <div class="input-area">
    <button class="action-btn" id="micBtn" onclick="toggleMicBtn()" title="Voice input">&#x1F3A4;</button>
    <textarea id="userInput" rows="1" placeholder="Type or speak..." autofocus></textarea>
    <button class="action-btn" id="sendBtn" onclick="sendMessage()">&#x27A4;</button>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
